<div class="gk-view" data-view="play">
  <div class="gk-topbar">
    <div class="gk-segment" role="group" aria-label="{{ui.packLabel}}" data-packs></div>
    <span class="gk-pill" data-counter></span>
  </div>

  <div class="gk-card">
    <p class="gk-eyebrow">{{ui.eyebrow}}</p>
    <p class="gk-question" data-question aria-live="polite"></p>
  </div>

  <div class="gk-options">
    <button type="button" class="gk-option gk-option--a" data-option="a"><b>A</b><span data-text></span><span class="badge" data-count>0</span></button>
    <span class="gk-vs" aria-hidden="true">{{ui.vs}}</span>
    <button type="button" class="gk-option gk-option--b" data-option="b"><b>B</b><span data-text></span><span class="badge" data-count>0</span></button>
  </div>
  <p class="gk-hint">{{ui.voteHint}}</p>

  <div class="gk-timer">
    <div class="gk-timer__track"><div class="gk-timer__fill" data-timer-fill></div></div>
    <span class="gk-timer__text" data-timer-text aria-live="polite">{{ui.timerReady}}</span>
  </div>

  <div class="gk-actions">
    <button type="button" class="btn btn--ghost btn--lg" data-discuss></button>
    <button type="button" class="btn btn--accent btn--lg" data-next>{{ui.next}} ▶</button>
  </div>

  <p class="gk-info">{{ui.info}}</p>
  <button type="button" class="link-button" data-end>{{ui.end}}</button>
</div>

<div class="gk-view" data-view="result" hidden>
  <div class="gk-result">
    <span class="gk-result__trophy" aria-hidden="true">🗣️</span>
    <h2 class="gk-result__title">{{ui.resultTitle}}</h2>
    <p class="gk-result__line" data-result-line></p>
  </div>
  <div class="gk-actions">
    <button type="button" class="btn btn--accent btn--lg" data-restart>{{ui.restart}} ▶</button>
  </div>
</div>
